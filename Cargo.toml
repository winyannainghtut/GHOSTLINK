[workspace]
members = ["packages/shared-contracts", "core/vpn-engine", "services/vpn-daemon", "cli/ghostlink", "integrations/mcp-server"]
resolver = "2"
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.8.5"
edition = "2021"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["full"] }
ghostlink-contracts = { path = "packages/shared-contracts" }
ghostlink-engine = { path = "core/vpn-engine" }

[profile.release]
lto = "thin"
strip = true

# Every unsafe block says why it is sound (code review 2026-11-10, Rust finding 4). CI runs
# clippy with -D warnings, so a new one without a SAFETY comment fails the build.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
