# Ghostlink server package (.deb and .rpm), built by scripts/build-linux-server.sh with nfpm.
# It carries the container image (docker save), so installing needs no registry.
# Template placeholders: @VERSION@, @GOARCH@, @PKG@ (staged package files).
name: ghostlink-server
arch: @GOARCH@
platform: linux
version: @VERSION@
version_schema: semver
release: "1"
section: net
priority: optional
maintainer: Ghostlink contributors <ghostlink@users.noreply.github.com>
vendor: Ghostlink
homepage: https://github.com/winyannainghtut/GHOSTLINK
license: GPL-3.0-or-later AND GPL-2.0-or-later
description: |-
  Self-hosted Ghostlink VPN server in a Docker container: Shadowsocks (Outline-compatible)
  is on by default; AmneziaWG, WireGuard and VLESS-REALITY are there to turn on, and so is
  IKEv2/IPsec for the built-in VPN of iPhone, iPad and Mac. Users, per-user and global
  traffic rules and data limits.
  Installing prints a management key for the Ghostlink app.

contents:
  - src: @PKG@/image.tar.gz
    dst: /usr/lib/ghostlink-server/image.tar.gz
    file_info: {mode: 0644}
  - src: @PKG@/ipsec-image.tar.gz
    dst: /usr/lib/ghostlink-server/ipsec-image.tar.gz
    file_info: {mode: 0644}
  - src: @PKG@/image.env
    dst: /usr/lib/ghostlink-server/image.env
    file_info: {mode: 0644}
  - src: packages/linux/server/ghostlink-server.sh
    dst: /usr/sbin/ghostlink-server
    file_info: {mode: 0755}
  - src: @PKG@/doc/
    dst: /usr/share/doc/ghostlink-server/
    type: tree

scripts:
  postinstall: packages/linux/scripts/server-postinstall.sh
  preremove: packages/linux/scripts/server-preremove.sh
  postremove: packages/linux/scripts/server-postremove.sh

overrides:
  deb:
    depends:
      - docker.io | docker-ce | moby-engine | docker-engine | podman-docker
      - passwd
  rpm:
    depends:
      - shadow-utils
