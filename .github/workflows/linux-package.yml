name: Linux package
# Reusable: on the given runner, builds the headless client (archive, .deb, .rpm) and the
# server (.deb, .rpm with its Docker images inside), installs both as a smoke test, runs the
# IKEv2/IPsec interop test, builds the IPsec component's GPL source, and uploads
# them as the workflow artifact "linux-<arch>". Called by release.yml.
on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      arch:
        required: true
        type: string
permissions:
  contents: read

jobs:
  package:
    name: Linux ${{ inputs.arch }} (client and server packages)
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: core/outline-worker/go.sum
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Install Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.92.0 --profile minimal
          rustup override set 1.92.0
      - name: Check version declarations and tag
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then set -- --tag "$GITHUB_REF_NAME"; fi
          echo "version=$(node scripts/release-version.mjs "$@")" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        run: cargo test --locked --workspace
      - name: Install nfpm (pinned)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Archive, .deb and .rpm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/build-linux.sh "$VERSION"
      - name: Smoke-test the .deb as a real systemd service
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          set -eu
          deb=$(ls artifacts/linux-$ARCH/ghostlink_*.deb)
          sudo apt-get install -y "./$deb"
          grep -q "^GHOSTLINK_OWNER_UID=$(id -u)$" /etc/ghostlink/ghostlinkd.env
          for i in $(seq 1 20); do systemctl is-active --quiet ghostlinkd && break; sleep 0.5; done
          systemctl is-active ghostlinkd
          ghostlink --json status | tee status.json
          grep -q '"status":"disconnected"' status.json
          ghostlink --json doctor | tee doctor.json
          grep -q '"outline_engine_available":true' doctor.json
          sudo apt-get purge -y ghostlink
          if systemctl is-active --quiet ghostlinkd; then echo "service still running after purge" >&2; exit 1; fi
          test ! -e /usr/bin/ghostlinkd && test ! -e /var/lib/ghostlink
      - name: Inspect the .rpm
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          sudo apt-get install -y rpm
          rpm -qip artifacts/linux-$ARCH/ghostlink-[0-9]*.rpm
          rpm -qlp artifacts/linux-$ARCH/ghostlink-[0-9]*.rpm | tee files.txt
          grep -qx /usr/bin/ghostlinkd files.txt && grep -qx /usr/lib/ghostlink/ghostlink-tunnel files.txt
          grep -qx /usr/lib/systemd/system/ghostlinkd.service files.txt
          rpm -qp --scripts artifacts/linux-$ARCH/ghostlink-[0-9]*.rpm | grep -q ghostlinkd
      - name: Server image, .deb and .rpm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          bash scripts/build-linux-server.sh "$VERSION"
      - name: Smoke-test the server .deb (install, API, keys, upgrade, purge)
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          set -eu
          dpkg -l | grep -Ei 'moby|docker' || true
          deb=$(ls artifacts/linux-$ARCH/ghostlink-server_*.deb)
          # The postinst loads the bundled image, creates the server and prints its key.
          sudo GHOSTLINK_SERVER_HOSTNAME=127.0.0.1 apt-get install -y "./$deb" | tee install.log
          grep -q '"apiUrl":"https://127.0.0.1:' install.log
          key=$(sudo ghostlink-server show-key | grep '^{')
          url=$(echo "$key" | jq -r .apiUrl)
          pin=$(echo "$key" | jq -r .certSha256)
          address=${url#https://}; address=${address%%/*}
          # The certificate the API presents is the one the management key pins.
          served=$(openssl s_client -connect "$address" -tls1_3 </dev/null 2>/dev/null | openssl x509 -outform DER | sha256sum | cut -d' ' -f1 | tr a-f A-F)
          test "$served" = "$pin"
          test "$(curl -sk -o /dev/null -w '%{http_code}' "https://$address/not-the-secret/server")" = 404
          curl -sk --fail "$url/server" | tee server.json
          jq -e '.protocols.amneziawg.enabled and .protocols.vless.enabled' server.json
          user=$(curl -sk --fail -X POST -d '{"name":"ci"}' "$url/users" | jq -r .id)
          for protocol in amneziawg wireguard vless shadowsocks; do
            curl -sk --fail -X POST -d "{\"protocol\":\"$protocol\"}" "$url/users/$user/keys" | jq -e '.access_key | length > 20'
          done
          docker inspect ghostlink-server --format '{{.State.Running}} readonly={{.HostConfig.ReadonlyRootfs}} capdrop={{.HostConfig.CapDrop}} user={{.Config.User}} net={{.HostConfig.NetworkMode}}' | tee container.txt
          grep -q '^true readonly=true capdrop=\[ALL\] user=[0-9]*:[0-9]* net=host$' container.txt
          sudo stat -c '%a %U' /var/lib/ghostlink-server | grep -qx '700 ghostlink-server'
          # An upgrade (here: reinstall) keeps users and keys.
          sudo apt-get install -y --reinstall "./$deb"
          curl -sk --fail "$url/users" | jq -e 'length == 1 and (.[0].keys | length) == 4'
          # Server-side admin commands (inside the container, through the local API).
          sudo ghostlink-server user add smoke --limit 1GB
          sudo ghostlink-server key add smoke vless --no-qr | grep -q '^vless://'
          sudo ghostlink-server users | grep -q smoke
          sudo ghostlink-server top --once | grep -q smoke
          sudo ghostlink-server stats smoke --range 24h | grep -q 'Traffic for smoke'
          sudo ghostlink-server kit smoke --output kit.html && sudo grep -q 'vless://' kit.html && test "$(stat -c %a kit.html)" = 600
          # Dashboard: its own port, loopback only, token sign-in, CSRF header required.
          sudo ghostlink-server dashboard | tee dashboard.txt
          dport=$(sed -n 's/.*-L 8080:127\.0\.0\.1:\([0-9]*\) .*/\1/p' dashboard.txt | head -n 1)
          token=$(sed -n 's/.*#t=\([A-Za-z0-9_-]*\).*/\1/p' dashboard.txt | head -n 1)
          test -n "$dport" && test -n "$token" && test "$dport" != 443
          ss -ltn | grep -q "127.0.0.1:$dport "
          if ss -ltn | grep -Eq "(0\.0\.0\.0|\*|\[::\]):$dport "; then echo "dashboard listens publicly" >&2; exit 1; fi
          curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$dport/" | grep -qx 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Ghostlink-Dashboard: 1' "http://127.0.0.1:$dport/api/server")" = 401
          jq -n --arg token "$token" '{token: $token}' > login.json
          test "$(curl -s -c jar.txt -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' --data @login.json "http://127.0.0.1:$dport/login")" = 204
          test "$(curl -s -b jar.txt -o /dev/null -w '%{http_code}' "http://127.0.0.1:$dport/api/server")" = 403
          curl -s --fail -b jar.txt -H 'X-Ghostlink-Dashboard: 1' "http://127.0.0.1:$dport/api/live" | jq -e '.users | length == 2'
          sudo apt-get purge -y ghostlink-server
          if docker ps -a --format '{{.Names}}' | grep -qx ghostlink-server; then echo "container left after purge" >&2; exit 1; fi
          test ! -e /var/lib/ghostlink-server && ! id ghostlink-server 2>/dev/null
      - name: Inspect the server .rpm
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          rpm -qip artifacts/linux-$ARCH/ghostlink-server-*.rpm
          rpm -qlp artifacts/linux-$ARCH/ghostlink-server-*.rpm | tee server-files.txt
          grep -qx /usr/sbin/ghostlink-server server-files.txt && grep -qx /usr/lib/ghostlink-server/image.tar.gz server-files.txt
          grep -qx /usr/lib/ghostlink-server/ipsec-image.tar.gz server-files.txt
          rpm -qp --scripts artifacts/linux-$ARCH/ghostlink-server-*.rpm | grep -q 'ghostlink-server setup'
      - name: IKEv2/IPsec interop (strongSwan client, all four sign-in methods)
        env:
          ARCH: ${{ inputs.arch }}
        run: sudo bash tests/ipsec/interop.sh artifacts/linux-$ARCH/ghostlink-server_*.deb
      - name: GPL source of the IPsec component
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ inputs.arch }}
        run: |
          bash scripts/ipsec-source.sh "$VERSION" "$ARCH" "artifacts/linux-$ARCH/ipsec-packages-$ARCH.txt"
          tar -tzf "artifacts/source/Ghostlink-$VERSION-ipsec-component-source-$ARCH.tar.gz" | grep -E '/strongswan/upstream/strongswan-.*\.tar\.bz2$'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ inputs.arch }}
          if-no-files-found: error
          path: |
            artifacts/linux-${{ inputs.arch }}/*.tar.gz
            artifacts/linux-${{ inputs.arch }}/*.deb
            artifacts/linux-${{ inputs.arch }}/*.rpm
            artifacts/source/*-ipsec-component-source-*.tar.gz
