name: Linux package
# Reusable: on the given runner, builds the headless client (archive, .deb, .rpm) and the
# server (.deb, .rpm with its Docker images inside) and the mesh agent (.deb, .rpm), installs
# them as a smoke test (the agent joins the installed server), runs the
# IKEv2/IPsec interop test, builds the IPsec component's GPL source, and uploads
# them as the workflow artifact "linux-<arch>". Called by release.yml.
on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      arch:
        required: true
        type: string
permissions:
  contents: read

jobs:
  package:
    name: Linux ${{ inputs.arch }} (client and server packages)
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: core/outline-worker/go.sum
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Install Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.92.0 --profile minimal
          rustup override set 1.92.0
      - name: Check version declarations and tag
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then set -- --tag "$GITHUB_REF_NAME"; fi
          # Assign first: inside echo's arguments a failed check would not fail the step.
          version=$(node scripts/release-version.mjs "$@")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        run: cargo test --locked --workspace
      - name: Install nfpm (pinned)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Archive, .deb and .rpm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/build-linux.sh "$VERSION"
      - name: Smoke-test the .deb as a real systemd service
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          set -eu
          running() {
            for i in $(seq 1 20); do systemctl is-active --quiet ghostlinkd && return 0; sleep 0.5; done
            systemctl is-active ghostlinkd
          }
          deb=$(ls artifacts/linux-$ARCH/ghostlink_*.deb)
          sudo apt-get install -y "./$deb"
          grep -q "^GHOSTLINK_OWNER_UID=$(id -u)$" /etc/ghostlink/ghostlinkd.env
          running
          ghostlink --json status | tee status.json
          grep -q '"status":"disconnected"' status.json
          ghostlink --json doctor | tee doctor.json
          grep -q '"outline_engine_available":true' doctor.json
          # An upgrade (here: a reinstall) restarts an enabled service and leaves a disabled one off.
          sudo apt-get install -y --reinstall "./$deb"
          running
          sudo systemctl disable --now ghostlinkd
          sudo apt-get install -y --reinstall "./$deb"
          if systemctl is-enabled --quiet ghostlinkd || systemctl is-active --quiet ghostlinkd; then echo "an upgrade turned a disabled service back on" >&2; exit 1; fi
          # Removing the package and installing it again turns an enabled service back on.
          sudo systemctl enable --now ghostlinkd
          sudo apt-get remove -y ghostlink
          sudo apt-get install -y "./$deb"
          systemctl is-enabled ghostlinkd
          running
          sudo apt-get purge -y ghostlink
          if systemctl is-active --quiet ghostlinkd; then echo "service still running after purge" >&2; exit 1; fi
          test ! -e /usr/bin/ghostlinkd && test ! -e /var/lib/ghostlink
      - name: Inspect the .rpm
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          sudo apt-get install -y rpm
          rpm -qip artifacts/linux-$ARCH/ghostlink-[0-9]*.rpm
          rpm -qlp artifacts/linux-$ARCH/ghostlink-[0-9]*.rpm | tee files.txt
          grep -qx /usr/bin/ghostlinkd files.txt
          grep -qx /usr/lib/ghostlink/ghostlink-tunnel files.txt
          grep -qx /usr/lib/systemd/system/ghostlinkd.service files.txt
          rpm -qp --scripts artifacts/linux-$ARCH/ghostlink-[0-9]*.rpm > scripts.txt
          grep -q 'posttrans scriptlet' scripts.txt
          grep -q ghostlinkd scripts.txt
      - name: Server image, .deb and .rpm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker version --format 'Docker {{.Server.Version}}'
          bash scripts/build-linux-server.sh "$VERSION"
      - name: Smoke-test the server .deb (install, API, keys, upgrade, dashboard)
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          set -eu
          dpkg -l | grep -Ei 'moby|docker' || true
          deb=$(ls artifacts/linux-$ARCH/ghostlink-server_*.deb)
          # The postinst loads the bundled image, creates the server and prints its key.
          sudo GHOSTLINK_SERVER_HOSTNAME=127.0.0.1 apt-get install -y "./$deb" | tee install.log
          grep -q '"apiUrl":"https://127.0.0.1:' install.log
          key=$(sudo ghostlink-server show-key | grep '^{')
          url=$(echo "$key" | jq -r .apiUrl)
          pin=$(echo "$key" | jq -r .certSha256)
          address=${url#https://}; address=${address%%/*}
          # The certificate the API presents is the one the management key pins.
          served=$(openssl s_client -connect "$address" -tls1_3 </dev/null 2>/dev/null | openssl x509 -outform DER | sha256sum | cut -d' ' -f1 | tr a-f A-F)
          test "$served" = "$pin"
          test "$(curl -sk -o /dev/null -w '%{http_code}' "https://$address/not-the-secret/server")" = 404
          curl -sk --fail "$url/server" | tee server.json
          # A new server runs only Shadowsocks; the other protocols have ports and keys but are off.
          jq -e '.protocols.shadowsocks.enabled and ([.protocols.amneziawg, .protocols.wireguard, .protocols.vless] | all(.enabled | not))' server.json
          user=$(curl -sk --fail -X POST -d '{"name":"ci"}' "$url/users" | jq -r .id)
          # A key for a protocol that is off is refused until the protocol is turned on.
          test "$(curl -sk -o /dev/null -w '%{http_code}' -X POST -d '{"protocol":"amneziawg"}' "$url/users/$user/keys")" = 400
          curl -sk --fail -X PATCH -d '{"protocols":{"amneziawg":{"enabled":true},"wireguard":{"enabled":true},"vless":{"enabled":true}}}' "$url/server" | jq -e '[.protocols.amneziawg, .protocols.wireguard, .protocols.vless] | all(.enabled)'
          for protocol in amneziawg wireguard vless shadowsocks; do
            curl -sk --fail -X POST -d "{\"protocol\":\"$protocol\"}" "$url/users/$user/keys" | jq -e '.access_key | length > 20'
          done
          docker inspect ghostlink-server --format '{{.State.Running}} readonly={{.HostConfig.ReadonlyRootfs}} capdrop={{.HostConfig.CapDrop}} add={{.HostConfig.CapAdd}} user={{.Config.User}} net={{.HostConfig.NetworkMode}} nnp={{.HostConfig.SecurityOpt}}' | tee container.txt
          grep -q '^true readonly=true capdrop=\[ALL\] add=\[[A-Z_ ]*\] user=0:0 net=host nnp=\[no-new-privileges\]$' container.txt
          added=$(sed -n 's/.* add=\[\([^]]*\)\].*/\1/p' container.txt | tr ' ' '\n' | sed 's/^CAP_//' | sort | tr '\n' ' ')
          test "$added" = "NET_BIND_SERVICE SETGID SETPCAP SETUID "
          # The container starts as root only so that the server can keep NET_BIND_SERVICE: the
          # running server is the server account, holds that one capability and nothing else, and
          # cannot gain more (bounding set, no_new_privs).
          pid=$(docker inspect --format '{{.State.Pid}}' ghostlink-server)
          grep -E '^(Uid|Gid|Groups|CapInh|CapPrm|CapEff|CapBnd|CapAmb|NoNewPrivs):' "/proc/$pid/status" | tee process.txt
          account=$(id -u ghostlink-server)
          group=$(id -g ghostlink-server)
          grep -Pq "^Uid:\t$account\t$account\t$account\t$account$" process.txt
          grep -Pq "^Gid:\t$group\t$group\t$group\t$group$" process.txt
          grep -Pq '^Groups:\s*$' process.txt
          for set in CapPrm CapEff CapBnd CapAmb; do grep -Pq "^$set:\t0000000000000400$" process.txt; done
          grep -Pq '^CapInh:\t0000000000000400$' process.txt
          grep -Pq '^NoNewPrivs:\t1$' process.txt
          # So it listens on ports below 1024: Shadowsocks moves to 443, TCP and UDP, and its keys follow.
          curl -sk --fail -X PATCH -d '{"protocols":{"shadowsocks":{"port":443}}}' "$url/server" | jq -e '.protocols.shadowsocks.port == 443'
          for i in $(seq 1 20); do ss -ltn | grep -q ':443 ' && break; sleep 0.5; done
          ss -ltn | grep ':443 ' > /dev/null
          ss -lun | grep ':443 ' > /dev/null
          sudo ghostlink-server keys ci --show | grep -E 'ss://[^@]+@127\.0\.0\.1:443/' > /dev/null
          sudo stat -c '%a %U' /var/lib/ghostlink-server | grep -qx '700 ghostlink-server'
          # Root never follows a symlink in the state, which the container account controls:
          # "ipsec enable" refuses one in place of the ipsec directory and changes nothing.
          sudo mkdir -m 0755 /tmp/not-ipsec
          sudo ln -sT /tmp/not-ipsec /var/lib/ghostlink-server/ipsec
          if sudo ghostlink-server ipsec enable 2> refused.txt; then echo "ipsec enable followed a symlink" >&2; exit 1; fi
          cat refused.txt
          grep -q 'not a plain directory' refused.txt
          # One check per line: in "a && b" a failing a does not stop a script run with set -e.
          test "$(stat -c '%U %a' /tmp/not-ipsec)" = 'root 755'
          test ! -e /etc/sysctl.d/90-ghostlink-ipsec.conf
          sudo rm /var/lib/ghostlink-server/ipsec
          sudo rmdir /tmp/not-ipsec
          # An upgrade (here: reinstall) keeps users and keys.
          sudo apt-get install -y --reinstall "./$deb"
          curl -sk --fail "$url/users" | jq -e 'length == 1 and (.[0].keys | length) == 4'
          # The upgrade keeps each protocol's switch (the server turned three on above).
          curl -sk --fail "$url/server" | jq -e '.protocols.amneziawg.enabled and .protocols.wireguard.enabled and .protocols.vless.enabled'
          # The installer's --reinstall really reinstalls: the post-install recreates the server.
          before=$(docker inspect --format '{{.Id}}' ghostlink-server)
          cat scripts/install-server.sh | sudo bash -s -- --package "./$deb" --reinstall | tee reinstall.txt
          grep -q 'Reinstalling Ghostlink server' reinstall.txt
          # The ports listed are those of the protocols that are on, and the hint about turning more on
          # is not shown when none is off.
          grep -Eq '^  [0-9]+/udp  AmneziaWG$' reinstall.txt
          if grep -q 'More protocols' reinstall.txt; then echo "the installer offers to turn on protocols that are all on" >&2; exit 1; fi
          test "$(docker inspect --format '{{.Id}}' ghostlink-server)" != "$before"
          curl -sk --fail "$url/users" | jq -e 'length == 1 and (.[0].keys | length) == 4'
          # Server-side admin commands (inside the container, through the local API).
          sudo ghostlink-server user add smoke --limit 1GB
          sudo ghostlink-server key add smoke vless --no-qr | grep -q '^vless://'
          sudo ghostlink-server users | grep -q smoke
          sudo ghostlink-server top --once | grep -q smoke
          sudo ghostlink-server stats smoke --range 24h | grep -q 'Traffic for smoke'
          sudo ghostlink-server kit smoke --output kit.html
          sudo grep -q 'vless://' kit.html
          test "$(stat -c %a kit.html)" = 600
          # rotate-key: the old key is refused at once, the new one (also in show-key) works with
          # the same certificate, and the users and the commands through the local API carry on.
          old=$url
          sudo ghostlink-server rotate-key | tee rotate.txt
          grep -q 'no longer works' rotate.txt
          new=$(sudo ghostlink-server show-key | grep '^{')
          url=$(echo "$new" | jq -r .apiUrl)
          test "$url" != "$old"
          test "$(echo "$new" | jq -r .certSha256)" = "$pin"
          test "$(curl -sk -o /dev/null -w '%{http_code}' "$old/users")" = 404
          curl -sk --fail "$url/users" | jq -e 'length == 2'
          sudo ghostlink-server users | grep -q smoke
          # What Ghostlink uses on the disk (the host command), and the storage lines of settings.
          sudo ghostlink-server disk | tee disk.txt
          grep -q 'What Ghostlink uses on this machine' disk.txt
          grep -q 'Log of ghostlink-server' disk.txt
          grep -Eq 'Server data +[0-9.]+ [KMGT]?B' disk.txt
          sudo ghostlink-server settings | grep -q 'Data kept by this server:'
          # The provider lookup downloads its list over HTTPS from inside the distroless image, which
          # must therefore carry CA certificates (checked without the network) ...
          . /usr/lib/ghostlink-server/image.env
          cid=$(docker create "$IMAGE")
          docker cp "$cid:/etc/ssl/certs/ca-certificates.crt" ca.crt
          docker rm "$cid" > /dev/null
          test "$(grep -c 'BEGIN CERTIFICATE' ca.crt)" -gt 50
          # ... and it is off in a new server, and refuses an update while off.
          sudo ghostlink-server asn status | grep -q ': off'
          if sudo ghostlink-server asn update 2> asn-refused.txt; then echo "asn update ran while the lookup is off" >&2; exit 1; fi
          grep -q 'turn it on first' asn-refused.txt
          # The real list once, from iptoasn.com. A failure of that site must not stop a release, so this
          # only warns; the log says how it went. When it works, it is checked and then turned off.
          # (No pipe into tee: this step has no pipefail, so the pipe would hide the exit status.)
          if sudo ghostlink-server asn on > asn.txt 2>&1; then
            cat asn.txt
            grep -q 'Provider lookup is on' asn.txt
            test -s /var/lib/ghostlink-server/asn.tsv.gz
            sudo ghostlink-server asn status | grep -q 'address ranges from iptoasn.com'
            sudo ghostlink-server asn off | grep -q deleted
            test ! -e /var/lib/ghostlink-server/asn.tsv.gz
          else
            cat asn.txt
            echo "::warning::the provider list could not be downloaded from iptoasn.com in this run: $(tail -n 2 asn.txt | tr '\n' ' ')"
            sudo ghostlink-server asn off > /dev/null || true
          fi
          # Dashboard: its own port, loopback only, token sign-in, CSRF header required.
          sudo ghostlink-server dashboard | tee dashboard.txt
          dport=$(sed -n 's/.*-L 8080:127\.0\.0\.1:\([0-9]*\) .*/\1/p' dashboard.txt | head -n 1)
          token=$(sed -n 's/.*#t=\([A-Za-z0-9_-]*\).*/\1/p' dashboard.txt | head -n 1)
          test -n "$dport"
          test -n "$token"
          test "$dport" != 443
          ss -ltn | grep -q "127.0.0.1:$dport "
          if ss -ltn | grep -Eq "(0\.0\.0\.0|\*|\[::\]):$dport "; then echo "dashboard listens publicly" >&2; exit 1; fi
          curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$dport/" | grep -qx 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Ghostlink-Dashboard: 1' "http://127.0.0.1:$dport/api/server")" = 401
          jq -n --arg token "$token" '{token: $token}' > login.json
          test "$(curl -s -c jar.txt -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' --data @login.json "http://127.0.0.1:$dport/login")" = 204
          test "$(curl -s -b jar.txt -o /dev/null -w '%{http_code}' "http://127.0.0.1:$dport/api/server")" = 403
          curl -s --fail -b jar.txt -H 'X-Ghostlink-Dashboard: 1' "http://127.0.0.1:$dport/api/live" | jq -e '.users | length == 2'
      - name: Mesh agent .deb and .rpm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/build-linux-mesh.sh "$VERSION"
      - name: Smoke-test the mesh agent (installer with an invite, join-here, leave, purge)
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          # pipefail: the installers below are piped into tee, which would hide their exit status.
          set -euo pipefail
          deb=$(ls artifacts/linux-$ARCH/ghostlink-mesh_*.deb)
          clean() {
            if ip link show glmesh0 >/dev/null 2>&1; then echo "glmesh0 left behind" >&2; exit 1; fi
            # grep reads all of the output (no -q), so iptables-save is never cut off by SIGPIPE,
            # which pipefail would turn into "no chains found".
            if sudo iptables-save | grep GHOSTLINK-MESH >/dev/null; then echo "firewall chains left behind" >&2; exit 1; fi
            if grep -q ghostlink-mesh /etc/hosts; then echo "/etc/hosts block left behind" >&2; exit 1; fi
          }
          connected() {
            for i in $(seq 1 40); do
              sudo ghostlink-mesh status --json > agent.json 2>/dev/null && jq -e '.status.state == "active"' agent.json >/dev/null && return 0
              sleep 0.5
            done
            cat agent.json >&2; return 1
          }
          sudo ghostlink-server mesh enable | tee mesh.txt
          # 1. "Add node": the command the app shows, with the local package instead of a download.
          invite=$(sudo ghostlink-server --json mesh invite --tags ci | tee invite.json | jq -r .invite)
          jq -e '.command | contains("install-mesh.sh") and contains("--join")' invite.json
          cat scripts/install-mesh.sh | sudo bash -s -- --package "./$deb" --join "$invite" --name ci-node | tee join.txt
          systemctl is-active ghostlink-mesh
          connected
          jq -e '.node.name == "ci-node" and (.node.address | startswith("100.96."))' agent.json
          # grep reads its whole input here: with pipefail, grep -q quitting at its first match can kill the writer with SIGPIPE (exit 141).
          ip -brief address show glmesh0 | grep ' 100\.96\.' > /dev/null
          getent hosts ci-node.mesh | grep '^100\.96\.' > /dev/null
          sudo ghostlink-server --json mesh nodes | jq -e '[.nodes[] | select(.name == "ci-node" and .online and .tags == ["ci"])] | length == 1'
          # 2. Leaving removes the node from the coordinator and everything on the host.
          sudo systemctl stop ghostlink-mesh
          sudo ghostlink-mesh leave
          clean
          sudo ghostlink-server --json mesh nodes | jq -e '.nodes | length == 0'
          # 3. The server installer with --mesh: this host joins as the relay (mesh join-here).
          server_deb=$(ls artifacts/linux-$ARCH/ghostlink-server_*.deb)
          cat scripts/install-server.sh | sudo bash -s -- --package "./$server_deb" --mesh-package "./$deb" | tee installer.txt
          grep -q '/udp  mesh (this server as a node)' installer.txt
          grep -q '/tcp  mesh coordinator' installer.txt
          systemctl is-active ghostlink-mesh
          connected
          sudo ghostlink-server --json mesh nodes | jq -e '[.nodes[] | select(.relay and .online)] | length == 1'
          sudo apt-get purge -y ghostlink-mesh
          clean
          test ! -e /var/lib/ghostlink-mesh
          test ! -e /usr/bin/ghostlink-mesh
          sudo ghostlink-server --json mesh nodes | jq -e '.nodes | length == 0'
      - name: Inspect the mesh .rpm
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          rpm -qip artifacts/linux-$ARCH/ghostlink-mesh-*.rpm
          rpm -qlp artifacts/linux-$ARCH/ghostlink-mesh-*.rpm | tee mesh-files.txt
          grep -qx /usr/bin/ghostlink-mesh mesh-files.txt
          grep -qx /usr/lib/systemd/system/ghostlink-mesh.service mesh-files.txt
          rpm -qp --scripts artifacts/linux-$ARCH/ghostlink-mesh-*.rpm > mesh-scripts.txt
          grep -q 'posttrans scriptlet' mesh-scripts.txt
          grep -q 'ghostlink-mesh leave' mesh-scripts.txt
      - name: Purge the server .deb
        run: |
          set -eu
          sudo apt-get purge -y ghostlink-server
          if docker ps -a --format '{{.Names}}' | grep -qx ghostlink-server; then echo "container left after purge" >&2; exit 1; fi
          test ! -e /var/lib/ghostlink-server
          if id ghostlink-server 2>/dev/null; then echo "the account is left after purge" >&2; exit 1; fi
      - name: Smoke-test the migration from Outline (installer --migrate-outline, rollback)
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          deb=$(ls artifacts/linux-$ARCH/ghostlink-server_*.deb)
          # A fake Outline: shadowbox's files, and containers named like Outline's that hold its port.
          sudo mkdir -p /opt/outline/persisted-state
          jq -n '{hostname: "127.0.0.1", portForNewAccessKeys: 45678, name: "CI Outline", accessKeyDataLimit: {bytes: 50000000000}}' |
            sudo tee /opt/outline/persisted-state/shadowbox_server_config.json >/dev/null
          jq -n '{nextId: 3, accessKeys: [
              {id: "0", name: "Phone", password: "cGhvbmUtcGFzc3dvcmQ", port: 45678, encryptionMethod: "chacha20-ietf-poly1305"},
              {id: "1", name: "", password: "a2V5LW9uZS1wYXNz", port: 45678},
              {id: "2", name: "Router", password: "cm91dGVyLXBhc3M", port: 45679, encryptionMethod: "aes-256-gcm"},
              {id: "3", name: "Old", password: "b2xkLXBhc3M", port: 443}]}' |
            sudo tee /opt/outline/persisted-state/shadowbox_config.json >/dev/null
          sudo sha256sum /opt/outline/persisted-state/*.json > outline.sha256
          docker run -d --name shadowbox --restart always --network host busybox:1.36 httpd -f -p 45678
          docker run -d --name watchtower --restart always busybox:1.36 sleep infinity
          # --check installs Ghostlink next to Outline and only reports.
          cat scripts/install-server.sh | sudo bash -s -- --package "./$deb" --hostname 127.0.0.1 --migrate-outline --check | tee check.txt
          grep -q 'Check only' check.txt
          grep -q '4 clients' check.txt
          # Old's key on 443, a port below 1024, is kept as it is: every key is.
          grep -q '4 keep their Outline key as it is' check.txt
          test "$(docker inspect --format '{{.State.Running}} {{.HostConfig.RestartPolicy.Name}}' shadowbox)" = "true always"
          # grep reads its whole input here: with pipefail, grep -q quitting at its first match can kill the writer with SIGPIPE (exit 141).
          sudo ghostlink-server users | grep 'No users yet' > /dev/null
          # A failed import (another program holds Router's port) puts Outline back as it was.
          docker run -d --name blocker --network host busybox:1.36 httpd -f -p 45679
          if sudo ghostlink-server migrate-outline 2> failed.txt; then echo "the import should have failed" >&2; exit 1; fi
          cat failed.txt
          grep -q 'Outline is back as it was' failed.txt
          test "$(docker inspect --format '{{.State.Running}} {{.HostConfig.RestartPolicy.Name}}' shadowbox)" = "true always"
          test "$(docker inspect --format '{{.State.Running}} {{.HostConfig.RestartPolicy.Name}}' watchtower)" = "true always"
          sudo ghostlink-server users | grep 'No users yet' > /dev/null
          sudo test ! -e /var/lib/ghostlink-server/outline-import
          docker rm -f blocker
          # The migration: Outline stops for good, Ghostlink serves its ports and keys.
          cat scripts/install-server.sh | sudo bash -s -- --package "./$deb" --hostname 127.0.0.1 --migrate-outline | tee migrate.txt
          grep -q 'Imported from Outline' migrate.txt
          grep -q 'To go back to Outline' migrate.txt
          grep -q '45679/udp  Shadowsocks (keys from Outline)' migrate.txt
          grep -q '443/udp  Shadowsocks (keys from Outline)' migrate.txt
          # The server is new, so only Shadowsocks is on: the protocols that are off are not listed (or opened).
          if grep -Eq '^  [0-9]+/(tcp|udp)  (VLESS-REALITY|WireGuard|AmneziaWG)$' migrate.txt; then echo "the installer lists a protocol that is off" >&2; exit 1; fi
          grep -q 'off for now: amneziawg, wireguard, vless' migrate.txt
          for name in shadowbox watchtower; do
            test "$(docker inspect --format '{{.State.Running}} {{.HostConfig.RestartPolicy.Name}}' "$name")" = "false no"
          done
          ss -ltn > tcp.txt
          ss -lun > udp.txt
          grep -q ':45678 ' tcp.txt
          grep -q ':45679 ' tcp.txt
          grep -q ':443 ' tcp.txt
          grep -q ':443 ' udp.txt
          grep -q ':45678 ' udp.txt
          sudo ghostlink-server --json users | jq -e '[.[].name] == ["Phone", "Key 1", "Router", "Old"] and .[0].data_limit_bytes == 50000000000'
          credential() { printf '%s' "$1" | base64 -w0 | tr '+/' '-_' | tr -d '='; }
          sudo ghostlink-server keys Phone --show | grep -F "ss://$(credential chacha20-ietf-poly1305:cGhvbmUtcGFzc3dvcmQ)@127.0.0.1:45678/" > /dev/null
          sudo ghostlink-server keys Router --show | grep -F "ss://$(credential aes-256-gcm:cm91dGVyLXBhc3M)@127.0.0.1:45679/" > /dev/null
          sudo ghostlink-server keys Old --show | grep -F "ss://$(credential chacha20-ietf-poly1305:b2xkLXBhc3M)@127.0.0.1:443/" > /dev/null
          sudo ghostlink-server settings | grep '45679 for keys from Outline' > /dev/null
          # The private copies are gone; Outline's own files are as they were.
          sudo test ! -e /var/lib/ghostlink-server/outline-import
          sudo sha256sum /opt/outline/persisted-state/*.json | diff - outline.sha256
          # A second run is refused before Outline is touched.
          if sudo ghostlink-server migrate-outline 2> again.txt; then echo "a second migration went through" >&2; exit 1; fi
          grep -q 'already has clients' again.txt
          # The rollback the migration printed brings Outline back.
          sudo ghostlink-server stop
          sudo docker update --restart=always shadowbox watchtower
          sudo docker start shadowbox watchtower
          test "$(docker inspect --format '{{.State.Running}} {{.HostConfig.RestartPolicy.Name}}' shadowbox)" = "true always"
          docker rm -f shadowbox watchtower
          sudo rm -rf /opt/outline
          sudo apt-get purge -y ghostlink-server
      - name: Inspect the server .rpm
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          rpm -qip artifacts/linux-$ARCH/ghostlink-server-*.rpm
          rpm -qlp artifacts/linux-$ARCH/ghostlink-server-*.rpm | tee server-files.txt
          grep -qx /usr/sbin/ghostlink-server server-files.txt
          grep -qx /usr/lib/ghostlink-server/image.tar.gz server-files.txt
          grep -qx /usr/lib/ghostlink-server/ipsec-image.tar.gz server-files.txt
          rpm -qp --scripts artifacts/linux-$ARCH/ghostlink-server-*.rpm | grep -q 'ghostlink-server setup'
      - name: IKEv2/IPsec interop (strongSwan client, all four sign-in methods)
        env:
          ARCH: ${{ inputs.arch }}
        run: sudo bash tests/ipsec/interop.sh artifacts/linux-$ARCH/ghostlink-server_*.deb
      - name: GPL source of the IPsec component
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ inputs.arch }}
        run: |
          bash scripts/ipsec-source.sh "$VERSION" "$ARCH" "artifacts/linux-$ARCH/ipsec-packages-$ARCH.txt"
          tar -tzf "artifacts/source/Ghostlink-$VERSION-ipsec-component-source-$ARCH.tar.gz" | grep -E '/strongswan/upstream/strongswan-.*\.tar\.bz2$'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ inputs.arch }}
          if-no-files-found: error
          path: |
            artifacts/linux-${{ inputs.arch }}/*.tar.gz
            artifacts/linux-${{ inputs.arch }}/*.deb
            artifacts/linux-${{ inputs.arch }}/*.rpm
            artifacts/source/*-ipsec-component-source-*.tar.gz
