name: Desktop and local engine verification
# Also called by release.yml, so that a draft release needs these checks to pass.
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  control-plane:
    strategy:
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: core/outline-worker/go.sum
      - name: Install Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --component clippy --component rustfmt
      - name: Select Rust toolchain
        run: rustup override set 1.92.0
      - name: Linux development dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev openvpn libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build managed worker and server
        working-directory: core/outline-worker
        shell: bash
        run: |
          mkdir -p ../../target/debug
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; else suffix=; fi
          go test -tags with_gvisor,with_utls,with_wireguard ./...
          go vet -tags with_gvisor,with_utls,with_wireguard ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags with_gvisor,with_utls,with_wireguard ./...
          CGO_ENABLED=0 go build -mod=readonly -trimpath -tags with_gvisor,with_utls,with_wireguard -o "../../target/debug/ghostlink-tunnel$suffix" .
          # The process suite manages a real local server through its management key.
          CGO_ENABLED=0 go build -mod=readonly -trimpath -tags with_gvisor,with_utls,with_wireguard -o "../../target/debug/ghostlink-server$suffix" ./cmd/ghostlink-server
      - name: Windows core build, unit tests and clippy
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/cargo.ps1 build --locked --workspace
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/cargo.ps1 test --locked --workspace
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/cargo.ps1 clippy --locked --workspace --all-targets '--' -D warnings
      - name: Linux core build, unit tests and clippy
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --workspace
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
      # bash on both systems: Windows' default PowerShell would only check the last command.
      - name: Process tests
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Windows independent encrypted peer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tools | Out-Null
          # Release downloads sometimes answer 5xx for a while; retry instead of failing the job.
          Invoke-WebRequest 'https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64.zip' -OutFile '.tools/peer.zip' -MaximumRetryCount 5 -RetryIntervalSec 15
          if ((Get-FileHash '.tools/peer.zip').Hash -ne '99185D75D314A07DBBA4A130C8AD986CBEB629A07927975636B341CA61F991DF') { throw 'Peer checksum mismatch' }
          Expand-Archive '.tools/peer.zip' '.tools/peer'
          $env:GHOSTLINK_TEST_SING_BOX = (Resolve-Path '.tools/peer/sing-box-1.14.4-windows-amd64/sing-box.exe').Path
          $env:GHOSTLINK_TEST_OUTLINE_WORKER = (Resolve-Path 'target/debug/ghostlink-tunnel.exe').Path
          "GHOSTLINK_TEST_SING_BOX=$env:GHOSTLINK_TEST_SING_BOX" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          ./scripts/cargo.ps1 test --locked -p ghostlink-engine --test outline_traffic --test worker_protocols '--' --ignored --nocapture --test-threads=1
      - name: Linux independent encrypted peer
        if: runner.os == 'Linux'
        run: |
          mkdir -p .tools/peer
          # --retry treats 5xx answers such as 504 as transient and tries again.
          curl -fLsS --retry 5 --retry-delay 15 'https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz' -o .tools/peer.tar.gz
          printf '%s\n' '699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968  .tools/peer.tar.gz' | sha256sum -c
          tar -xzf .tools/peer.tar.gz -C .tools/peer
          export GHOSTLINK_TEST_SING_BOX="$PWD/.tools/peer/sing-box-1.14.4-linux-amd64/sing-box"
          export GHOSTLINK_TEST_OUTLINE_WORKER="$PWD/target/debug/ghostlink-tunnel"
          echo "GHOSTLINK_TEST_SING_BOX=$GHOSTLINK_TEST_SING_BOX" >> "$GITHUB_ENV"
          cargo test --locked -p ghostlink-engine --test outline_traffic --test worker_protocols -- --ignored --nocapture --test-threads=1
      # After the peer downloads, so the offline Outline-compatible proxy is tested with sing-box.
      - name: Provisioning tests
        shell: bash
        run: python -m unittest discover -s tests/integration -p 'test_*.py' -v
      - name: Windows GUI build
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/cargo.ps1 build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Linux GUI build
        if: runner.os == 'Linux'
        run: cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Formatting
        shell: bash
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
