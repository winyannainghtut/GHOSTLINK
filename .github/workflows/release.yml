name: Release
# Builds unsigned pre-release packages for every supported platform. Pushing a vX.Y.Z tag that
# matches the Cargo workspace version also creates a DRAFT GitHub release for review; nothing
# is public until a maintainer publishes the draft. A manual run, on a branch or a tag, only
# builds and tests. A published release is never changed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 (MSI, portable ZIP, worker source)
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: core/outline-worker/go.sum
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup override set 1.92.0
      - name: Check version declarations and tag
        id: version
        shell: pwsh
        run: |
          $tagArguments = if ($env:GITHUB_REF_TYPE -eq 'tag') { @('--tag', $env:GITHUB_REF_NAME) } else { @() }
          $version = node scripts/release-version.mjs @tagArguments
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Pinned WiX tools
        shell: pwsh
        run: ./scripts/bootstrap-windows.ps1
      - name: Unit tests
        shell: pwsh
        run: ./scripts/cargo.ps1 test --locked --workspace
      - name: Installer and portable archive
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Worker corresponding source (GPL)
        shell: pwsh
        run: ./scripts/package-worker-source.ps1 -Version '${{ steps.version.outputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            artifacts/windows-x64/*.msi
            artifacts/windows-x64/*.zip
            artifacts/source/*.zip

  # Ubuntu 22.04 builds link against glibc 2.35 / OpenSSL 3, so they also run on newer distros.
  linux-x64:
    uses: ./.github/workflows/linux-package.yml
    with:
      runner: ubuntu-22.04
      arch: x64

  # Hosted arm64 runners may be unavailable (for example in some private repositories), so this
  # job never gates the draft release; attach-linux-arm64 adds its archive when it finishes.
  linux-arm64:
    uses: ./.github/workflows/linux-package.yml
    with:
      runner: ubuntu-22.04-arm
      arch: arm64

  # The checks every push runs (Go tests and vet, the process suite, clippy and formatting, and
  # the committed web UI builds), so a draft is only made from a commit that passes them.
  desktop:
    uses: ./.github/workflows/desktop.yml

  ui:
    uses: ./.github/workflows/ui.yml

  publish:
    name: Draft GitHub release
    # Only a pushed tag makes or updates the draft; a manual run is a dry run, even on a tag.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [windows, linux-x64, desktop, ui]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: downloaded/windows-x64
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: downloaded/linux-x64
      - name: Collect files and checksums
        run: |
          mkdir release
          find downloaded -type f -exec mv -t release {} +
          (cd release && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          node scripts/changelog-section.mjs "$VERSION" > changes.md
          # The changes go in through a function, so "$&", "$'" or "$$" in them stay as written.
          node -e 'const fs=require("fs");const t=fs.readFileSync(".github/release-notes.md","utf8").replaceAll("@VERSION@",process.argv[1]).replace("@CHANGES@",()=>fs.readFileSync("changes.md","utf8").trim());fs.writeFileSync("notes.md",t)' "$VERSION"
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            # A published release keeps the files and checksums it was published with.
            if [ "$draft" != true ]; then echo "$TAG is already published; this run changed nothing." >&2; exit 1; fi
            # A re-run replaces the draft's files and deletes those it did not build again (such as
            # arm64 files when the arm64 job does not finish this time), so that SHA256SUMS.txt lists
            # every file. attach-linux-arm64 adds this run's arm64 files.
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > assets.txt
            while IFS= read -r name; do
              if [ ! -e "release/$name" ]; then gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes; fi
            done < assets.txt
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
              --title "Ghostlink $VERSION" --notes-file notes.md
          fi

  attach-linux-arm64:
    name: Attach Linux arm64 to the draft release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [publish, linux-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64
          path: arm64
      - name: Upload arm64 packages and refresh checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A published release keeps the files and checksums it was published with.
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$draft" != true ]; then echo "$TAG is already published; the arm64 files were not attached." >&2; exit 1; fi
          # The artifact holds packages and the IPsec source bundle in subfolders; attach them flat.
          mkdir flat
          find arm64 -type f -exec mv -t flat {} +
          rm -rf arm64
          mv flat arm64
          # Release downloads sometimes answer 5xx for a while: try a few times (--clobber, so a
          # file left by a failed try does not stop the next one).
          for attempt in 1 2 3 4 5; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir sums --clobber && break
            [ "$attempt" = 5 ] && exit 1
            sleep 15
          done
          # Idempotent on re-runs: drop any previous line for these files before appending.
          cp sums/SHA256SUMS.txt sums/next.txt
          for file in arm64/*; do
            name=$(basename "$file")
            awk -v n="$name" '$2 != n && $2 != "*"n' sums/next.txt > sums/filtered.txt
            mv sums/filtered.txt sums/next.txt
          done
          (cd arm64 && sha256sum -- *) >> sums/next.txt
          mv sums/next.txt sums/SHA256SUMS.txt
          cat sums/SHA256SUMS.txt
          # Every file the draft will hold must have a line in SHA256SUMS.txt.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > assets.txt
          ls arm64 >> assets.txt
          sort -u -o assets.txt assets.txt
          while IFS= read -r name; do
            if [ "$name" != SHA256SUMS.txt ] && ! awk -v n="$name" '$2 == n || $2 == "*"n {found = 1} END {exit !found}' sums/SHA256SUMS.txt; then
              echo "SHA256SUMS.txt would not list $name" >&2
              exit 1
            fi
          done < assets.txt
          gh release upload "$TAG" arm64/* sums/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
