name: IPsec interop
# Builds the server package with its IPsec component and runs tests/ipsec/interop.sh: a real
# strongSwan client connects with each Apple profile's parameters (IKEv2 EAP, IKEv2 certificate,
# IPsec certificate + XAuth, IPsec PSK + XAuth). Also builds the component's GPL source bundle.
on:
  push:
    paths:
      - 'core/outline-worker/**'
      - 'packages/linux/server/**'
      - 'tests/ipsec/**'
      - 'scripts/build-linux-server.sh'
      - 'scripts/ipsec-source.sh'
      - 'scripts/install-server.sh'
      - '.github/workflows/ipsec.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  interop:
    name: IKEv2/IPsec with a strongSwan client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: core/outline-worker/go.sum
      - name: Install nfpm (pinned)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Server packages with the IPsec image
        id: build
        run: |
          version=$(node scripts/release-version.mjs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          bash scripts/build-linux-server.sh "$version"
          cat artifacts/linux-x64/ipsec-packages-x64.txt
      - name: Interop test
        run: sudo bash tests/ipsec/interop.sh artifacts/linux-x64/ghostlink-server_*.deb
      - name: Installer script (with the package just built)
        run: |
          set -eu
          shellcheck --severity=warning scripts/install-server.sh packages/linux/server/ghostlink-server.sh
          bash scripts/install-server.sh --help | grep -q -- '--open-firewall'
          deb=$(ls "$PWD"/artifacts/linux-x64/ghostlink-server_*.deb)
          sudo bash scripts/install-server.sh --package "$deb" --hostname 127.0.0.1 | tee install.log
          grep -q '"apiUrl":"https://127.0.0.1:' install.log
          grep -Eq '^  [0-9]+/udp  AmneziaWG$' install.log
          grep -Eq '^  [0-9]+/tcp  management API' install.log
          # A second run changes nothing; machine-readable admin output works through the host command.
          sudo bash scripts/install-server.sh --package "$deb" | tee again.log
          grep -q 'is already installed' again.log
          sudo ghostlink-server --json users | jq -e 'type == "array"'
          # Piped, as with curl | sudo bash, adding IKEv2/IPsec.
          sudo bash -s -- --package "$deb" --ipsec < scripts/install-server.sh | tee ipsec.log
          grep -q '500/udp  IKEv2/IPsec' ipsec.log
          sudo ghostlink-server settings | grep -q 'IPsec component: running'
          sudo ghostlink-server ipsec disable
          sudo apt-get purge -y ghostlink-server >/dev/null
          test ! -e /var/lib/ghostlink-server
      - name: GPL source of the IPsec component
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          bash scripts/ipsec-source.sh "$VERSION" x64 artifacts/linux-x64/ipsec-packages-x64.txt
          tar -tzf artifacts/source/Ghostlink-*-ipsec-component-source-x64.tar.gz | grep -E '/(strongswan|iptables)/APKBUILD$'
          tar -tzf artifacts/source/Ghostlink-*-ipsec-component-source-x64.tar.gz | grep -E '/strongswan/upstream/strongswan-.*\.tar\.bz2$'
