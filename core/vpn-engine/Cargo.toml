[package]
name = "ghostlink-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
ghostlink-contracts.workspace = true
rand = "0.8"
pem = "3"
x509-parser = "0.18"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
url = "2.5"
percent-encoding = "2.3"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "socks"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

[dev-dependencies]
tempfile = "3"
