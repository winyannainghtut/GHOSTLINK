[package]
name = "ghostlink-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
ghostlink-contracts.workspace = true
rand = "0.8"
pem = "3"
x509-parser = "0.18"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
url = "2.5"
percent-encoding = "2.3"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "socks", "rustls-tls-manual-roots"] }
# Management connections pin a self-signed certificate during the handshake (TLS 1.3, ring).
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

[dev-dependencies]
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

# Its own main: the test binary is also the stand-in tunnel worker it starts.
[[test]]
name = "worker_exit"
harness = false

[lints]
workspace = true
