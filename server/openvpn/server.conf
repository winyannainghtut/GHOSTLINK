# Managed by Ansible. Certificates come from an OFFLINE CA bundle.
port 1194
proto udp
dev tun
topology subnet
server 10.8.0.0 255.255.255.0
ca ca.crt
cert server.crt
key server.key
dh none
tls-crypt tls-crypt.key
crl-verify crl.pem
verify-client-cert require
remote-cert-tls client
tls-version-min 1.2
data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305
auth SHA256
allow-compression no
keepalive 10 60
persist-key
persist-tun
user nobody
group nogroup
explicit-exit-notify 1
verb 1
status /run/openvpn-server/ghostlink-status.log 15
status-version 3
# Routing and DNS are selected by client policy. Never enable duplicate-cn.
