---
- name: Install personal OpenVPN server without replacing SSH or host firewall rules
  hosts: vpn
  become: true
  gather_facts: true
  tasks:
    - name: Require an explicit trusted bundle and network interface
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ghostlink_public_interface is match('^[A-Za-z0-9_.:-]+$')
          - ghostlink_server_bundle is defined
          - ghostlink_public_interface in ansible_facts['interfaces']
    - name: Install maintained distribution packages
      ansible.builtin.apt:
        name: [openvpn, nftables, python3]
        update_cache: true
        state: present
    - name: Create private server configuration directory
      ansible.builtin.file:
        path: /etc/openvpn/server
        state: directory
        owner: root
        group: root
        mode: '0755'
    - name: Deploy explicit server-only PKI bundle
      ansible.builtin.unarchive:
        src: '{{ ghostlink_server_bundle }}'
        dest: /etc/openvpn/server
        owner: root
        group: root
      no_log: true
      notify: Restart VPN
    - name: Protect server private keys
      ansible.builtin.file:
        path: '/etc/openvpn/server/{{ item }}'
        owner: root
        group: root
        mode: '0600'
      loop: [server.key, tls-crypt.key]
    - name: Ensure no CA private key was deployed
      ansible.builtin.stat:
        path: /etc/openvpn/server/ca.key
      register: ca_key
    - name: Fail if offline CA key is present
      ansible.builtin.assert:
        that: not ca_key.stat.exists
        fail_msg: Remove the offline CA private key from the online VPN server before deployment
    - name: Install server configuration
      ansible.builtin.copy:
        src: ../openvpn/server.conf
        dest: /etc/openvpn/server/ghostlink.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart VPN
    - name: Enable IPv4 forwarding without changing host default routes
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_set: true
        reload: true
        state: present
    - name: Install isolated VPN NAT rules
      ansible.builtin.template:
        src: ghostlink.nft.j2
        dest: /etc/openvpn/ghostlink.nft
        owner: root
        group: root
        mode: '0600'
      notify: Reload VPN NAT
    - name: Install dedicated NAT unit
      ansible.builtin.copy:
        src: ghostlink-nat.service
        dest: /etc/systemd/system/ghostlink-nat.service
        mode: '0644'
      register: nat_unit
      # A started oneshot unit keeps the commands it ran until it is restarted.
      notify: Restart VPN NAT
    - name: Start NAT unit
      ansible.builtin.systemd:
        name: ghostlink-nat
        daemon_reload: '{{ nat_unit.changed }}'
        enabled: true
        state: started
    - name: Start VPN
      ansible.builtin.systemd:
        name: openvpn-server@ghostlink
        enabled: true
        state: started
  handlers:
    - name: Reload VPN NAT
      ansible.builtin.systemd:
        name: ghostlink-nat
        state: reloaded
    - name: Restart VPN NAT
      ansible.builtin.systemd:
        name: ghostlink-nat
        state: restarted
    - name: Restart VPN
      ansible.builtin.systemd:
        name: openvpn-server@ghostlink
        state: restarted
